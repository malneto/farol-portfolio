    var ratio = ltv.map(function(l,i){ return l/cac[i]; });
    var mrrNow = mrr[11];
    var arpu = mrrNow / c.customerCount;
    return {
      id:c.id, name:c.name, sector:c.sector, status:c.status,
      mrr:mrr, cac:cac, ltv:ltv, ratio:ratio,
      mrrNow:mrrNow, mrrGrowth:(mrr[11]-mrr[10])/mrr[10]*100,
      cacNow:cac[11], ltvNow:ltv[11], ratioNow:ratio[11],
      churn:c.churn, churnPrev:c.churnPrev,
      runway:c.runway, invested:c.invested, equity:c.equity, valuation:c.valuation, investedDate:c.investedDate,

      customerCount:c.customerCount, grossMargin:c.grossMargin, cashBalance:c.cashBalance, nrr:c.nrr,

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function statusChip(status){
    var span = el('span','chip status-'+status);
    span.appendChild(el('span','dot'));
    span.appendChild(document.createTextNode(STATUS[status].label));
    return span;
  }

  /* ---------------- documentos & conciliação (mesma lógica do Farol) ---------------- */
  var DOC_STATUS = {
    processed:  {chip:'status-hold',   label:'Processado'},
    matches:    {chip:'status-invest', label:'Bate com o balancete'},
    mismatch:   {chip:'status-exit',   label:'Divergência encontrada'},
    processing: {chip:'status-watch',  label:'Processando…'}
  };
  function docChip(key){
    var m = DOC_STATUS[key];
    var span = el('span','chip '+m.chip);
    span.appendChild(el('span','dot'));
    span.appendChild(document.createTextNode(m.label));
    return span;
  }
  var DOC_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>';

  function baseDocsFor(c){
    var hasMismatch = !!c.bankNote;
    return [
      {name:'Balancete (DRE) — '+DOC_DATE+'.pdf', type:'Contábil · enviado pela empresa', status:'processed',
       fields:[['Receita do mês', fmtBRLFull(c.mrrNow)],['Resultado do mês (aprox.)', fmtSignedBRL(-c.burnMonthly)],['Caixa reportado', fmtBRLFull(c.cashBalance)]], note:null},
      {name:'Extrato bancário — '+DOC_DATE+'.pdf', type:'Open Finance · leitura direta do banco', status: hasMismatch ? 'mismatch' : 'matches',
       fields:[['Saldo final no banco', fmtBRLFull(c.bankCash)],['Diferença vs. balancete', fmtSignedBRL(c.bankCash - c.cashBalance)]], note:c.bankNote}
    ];
  }
  function docCardEl(doc){
    var card = el('div','doc-card');
    var icon = el('div','icon'); icon.innerHTML = DOC_ICON;
    card.appendChild(icon);
    var body = el('div','body');
    var head = el('div','head');
    head.appendChild(el('span','name', doc.name));
    head.appendChild(docChip(doc.status));
    body.appendChild(head);
    body.appendChild(el('div','meta', doc.type));
    if (doc.status === 'processing'){
      var pr = el('div','doc-processing');
      pr.appendChild(el('span','spin'));
      pr.appendChild(document.createTextNode('Lendo o documento e extraindo os números…'));
      body.appendChild(pr);
    } else {
      var fields = el('div','doc-fields');
      doc.fields.forEach(function(f){
        var ff = el('div','f');
        ff.appendChild(el('div','l', f[0]));
        var bad = doc.status === 'mismatch' && f[0].indexOf('Diferença') === 0;
        ff.appendChild(el('div','v'+(bad?' bad':''), f[1]));
        fields.appendChild(ff);
      });
      body.appendChild(fields);
      if (doc.note){
        var note = el('div','doc-note');
        note.appendChild(el('b',null,'O que a IA encontrou'));
        note.appendChild(document.createTextNode(doc.note));
        body.appendChild(note);
      }
    }
    card.appendChild(body);
    return card;
  }
  function renderDocs(container, c){
    container.innerHTML = '';
    var drop = el('div','doc-drop');
    drop.tabIndex = 0; drop.setAttribute('role','button');
    drop.innerHTML = DOC_ICON.replace('width="17" height="17"','width="20" height="20"');
    drop.appendChild(el('strong',null,'Enviar novo documento'));
    drop.appendChild(el('div','hint','PDF ou foto de balancete, DRE ou extrato — clique para simular o envio e a leitura por IA'));
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.pdf,image/*'; input.style.display = 'none';
    drop.appendChild(input);
    drop.addEventListener('click', function(){ input.click(); });
    drop.addEventListener('keydown', function(e){ if (e.key==='Enter' || e.key===' '){ e.preventDefault(); input.click(); } });
    container.appendChild(drop);
    var list = el('div','doc-list');
    container.appendChild(list);
    function paint(){
      list.innerHTML = '';
      c.uploadedDocs.concat(baseDocsFor(c)).forEach(function(doc){ list.appendChild(docCardEl(doc)); });
    }
    paint();
    input.addEventListener('change', function(){
      if (!input.files || !input.files[0]) return;
      var pending = {name:input.files[0].name, type:'Enviado agora · em processamento', status:'processing', fields:[], note:null};
      c.uploadedDocs.unshift(pending);
      paint();
      setTimeout(function(){
        pending.status = 'matches';
        pending.type = 'Conferido contra o Open Finance';
        pending.fields = [['Caixa identificado', fmtBRLFull(c.bankCash)],['Diferença vs. dados atuais', fmtSignedBRL(0)]];
        paint();
      }, 1400);
      input.value = '';
    });
  }

  /* ---------------- switcher ---------------- */
  function renderSwitcher(activeId){
    var nav = document.getElementById('switcher');
    nav.innerHTML = '';
    companies.forEach(function(c){
      var a = el('a','switch-pill'+(c.id===activeId?' active':''));
      a.href = '#'+c.id;
      var dot = el('span','dot');
      dot.style.background = 'var(--' + ({invest:'good',hold:'neutral-status',watch:'warning',restructure:'serious',exit:'critical'}[c.status]) + ')';
      a.appendChild(dot);
      a.appendChild(document.createTextNode(c.name));
      nav.appendChild(a);
    });
  }

  /* ---------------- render company ---------------- */
  function openAccountsCol(title, rows){
    var col = el('div','oa-col');
    col.appendChild(el('div','oa-col-head', title));
    rows.forEach(function(r){
      var row = el('div','oa-row');
      var left = el('div');
      left.appendChild(el('div','who', r.who));
      left.appendChild(el('div','due', 'vence ' + r.due));
      row.appendChild(left);
      var right = el('div','right');
      right.appendChild(el('div','amount', fmtBRLFull(r.amount)));
      var st = OPEN_STATUS[r.status];
      var chip = el('span','chip '+st.cls);
      chip.appendChild(el('span','dot'));
      chip.appendChild(document.createTextNode(st.label));
      right.appendChild(chip);
      row.appendChild(right);
      col.appendChild(row);
    });
    return col;
  }

    s6.appendChild(el('h3',null,'Plano de ação'));
    s6.appendChild(el('div','sub','O que sai do "gargalo identificado" no Farol e vira tarefa com dono e prazo'));
    var al = el('div','action-list');
    c.actions.forEach(function(a){
      var row = el('div','ac-row');
      var left = el('div');
      left.appendChild(el('div','title', a.title));
      left.appendChild(el('div','meta', a.owner + ' · prazo ' + a.due));
      row.appendChild(left);
      var st = AC_STATUS[a.status];
      var chip = el('span','chip '+st.cls);
      chip.appendChild(el('span','dot'));
      chip.appendChild(document.createTextNode(st.label));
      row.appendChild(chip);
      al.appendChild(row);
    });
    s6.appendChild(al);
    root.appendChild(s6);

    var foot = el('div','section');
    var link = el('a', null, '← Ver ' + c.name + ' na visão estratégica (Farol)');
    link.href = 'index.html#' + c.id;
    foot.appendChild(link);
    root.appendChild(foot);
  }

  function currentId(){
    var id = location.hash.replace('#','');
    return companies.some(function(c){ return c.id===id; }) ? id : companies[0].id;
  }

  window.addEventListener('hashchange', function(){ render(currentId()); });
  render(currentId());
})();
</script>
